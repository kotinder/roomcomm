# Tool configuration only — roomcomm is not a distributable package, it is a
# service (see Dockerfile). There is deliberately no [project] table.
#
# Everything here exists so that the three commands AGENTS.md tells an agent to
# run before calling a change done mean the same thing on every machine:
#
#     pytest -q        ruff check .        mypy app
#
# Without this file each of them picked up the defaults of whatever tool version
# happened to be installed, and two of the three drowned in findings that had
# nothing to do with the change under review.

[tool.pytest.ini_options]
# `pytest -q` from the repo root used to die during collection: the working copy
# carries unrelated projects (pcis/ wants flask) whose tests pytest happily
# tried to import. The suite is tests/ and nothing else.
testpaths = ["tests"]
# tests/load/ drives a live server and is run by hand, not as part of the suite.
norecursedirs = ["load"]

[tool.ruff]
target-version = "py311"
extend-exclude = [
    # In the working copy, but not part of this service.
    "pcis", "node_modules", "data", "dossier", "docs",
    # Distributed from here, maintained in kotinder/roomcomm-mcp (see AGENTS.md).
    # Fixing a finding here would only drift from upstream and be overwritten by
    # the next sync; it belongs in that repo.
    "skill", "mcp",
]

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's defaults, which have widened over
# releases: on ruff 0.17 the implicit default started flagging import sorting
# (I001) and pyupgrade rewrites (UP) across every file, so the gate reported
# hundreds of findings on an untouched tree and stopped being readable.
#
# This set is the one the repo was written against: pyflakes plus the pycodestyle
# errors that catch real mistakes. Adopting I or UP means reordering imports and
# rewriting annotations in 26 files — worth doing, but as its own change, not as
# a side effect of a config commit.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The brace matcher in llm.extract_array is a character dispatch table: one line
# per case (`if esc: esc = False`) reads as the table it is, and splitting each
# case over two lines buries the state machine it implements.
"app/llm.py" = ["E701"]
# main.py imports the app's own submodules below the rate-limit helpers rather
# than at the top of the file. Nothing depends on that order — the cycles with
# a2a and mcp_server are broken by function-local imports on their side — but
# moving a 50-line import block in a 3400-line module is a change of its own,
# not a lint fix.
"app/main.py" = ["E402"]
# The suite patches module-level limits (ROOM_CREATE_LIMIT and friends) right
# after importing app.main, and keeps a few imports next to the section that
# uses them. Both are deliberate and local to the test file.
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
# The service runs on Linux (Dockerfile); checking as Windows made database.py's
# fcntl locking look like a missing attribute.
platform = "linux"
# SQLModel declares a model field with its Python type, not SQLAlchemy's
# Mapped[...], so at class level mypy sees `Room.id` as `int | None` instead of a
# column object. Every query expression then looks wrong in the same three ways:
# `Model.col == v` is "bool, expected ColumnElement" (arg-type), `.in_()`/
# `.asc()`/`.desc()` are "no attribute" on the field's Python type (union-attr),
# and `Model.col < v` is "int < None" (operator). That single false positive
# accounted for about 150 of the 189 errors this repo reported. Off until
# SQLModel annotates fields as Mapped[...]; everything else stays on, so a real
# type error still fails the gate.
disable_error_code = ["arg-type", "union-attr", "operator"]

[[tool.mypy.overrides]]
# Ships no py.typed marker; app/workers.py only subclasses its worker class.
module = ["uvicorn_worker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The repo-local mcp/ directory is the MCP *client* wrapper (maintained in
# kotinder/roomcomm-mcp), and it shadows the installed mcp SDK exactly as it does
# for a bare `uvicorn app.main:app` — see AGENTS.md. mypy resolved `import
# mcp.server.fastmcp` to the wrapper and then type-checked app/mcp_server.py
# against the wrong package. Skipping it makes the SDK opaque, which is the
# honest answer: it is a third-party dependency here, not our code.
module = ["mcp.*"]
follow_imports = "skip"
ignore_errors = true

# nginx site config for roomcomm (reverse proxy, rate limits, MCP/A2A).
# The live server runs this plus host-specific parts kept out of the repo
# (other sites on the same host, private includes, the exempt list below).
# Exempt list: IPs listed here as `<ip> 1;` skip nginx's limits (an empty key
# is never counted). Empty in the repo.
geo $limit_exempt {
    default 0;
}
map $limit_exempt $limit_key {
    0 $binary_remote_addr;
    1 "";
}
# Who the per-path zones below bill a request to: the *key* when the caller
# presents one, the address otherwise. Five agents on one office address, each
# with its own key, shared one address-sized budget and 429'd each other out
# (report 02.11.2026). $limit_key (the address) still carries the coarse
# `general` zone, the connection limits and the api_ip ceiling.
map $http_authorization $limit_rk {
    default "-";
    "~*^Bearer\s+(?<rk>rk_[A-Za-z0-9_-]{20,})" "rk:$rk";
}
# Exact strings are matched ahead of the regexes: "0-" = not exempt, no key.
map $limit_exempt$limit_rk $limit_subject {
    "0-"    $binary_remote_addr;  # anonymous: per address, as before
    "~^1"   "";                   # exempt address: not counted at all
    default $limit_rk;            # keyed: per key
}
# The write zones below count POSTs only. Until 11.11.2026 they covered the
# whole path, so polling a room (GET .../messages) spent the 10/min budget for
# sending to it, and listing rooms (GET /api/rooms) the 5/min one for creating
# them (report from Navio, 11.11.2026). An empty value is never counted.
map $request_method $limit_write_subject {
    POST    $limit_subject;
    default "";
}
# What the 429 says to wait: when the bucket that refused has room again,
# instead of a flat minute. nginx keeps a rate as an integer of thousandths
# per second (10r/m is 166, not 166.67), so a slot frees a little after
# 60 / rate seconds: 6.024 s at 10r/m. The answer is that interval plus one
# second, so a client that sleeps exactly that long gets in.
# nginx does not say which zone refused. Only a POST reaches a write zone, so
# a POST is told its path's write interval; any other method can only have
# met the per-address ceilings (general 30r/s, api_ip 300r/m) or the MCP and
# A2A zones (60r/m), which free up within a second. The LLM refresh zone
# counts every method, so its path answers the same for all of them.
# $uri is still the request's own inside @rate_limited.
map "$request_method:$uri" $limit_retry {
    default                                      1;
    "POST:/api/rooms"                            13;
    "POST:/api/skills"                           7;
    "~^POST:/api/rooms/[^/]+/messages$"          7;
    "~^[A-Z]+:/api/rooms/[^/]+/context/refresh$" 11;
}
# Rate limiting zones
limit_req_zone $limit_key zone=general:10m     rate=30r/s;
limit_req_zone $limit_write_subject zone=room_create_w:10m  rate=5r/m;
limit_req_zone $limit_write_subject zone=msg_send_w:10m     rate=10r/m;
# LLM arbiter refresh — expensive (1 LLM call per message). Hard cap.
limit_req_zone $limit_subject zone=llm_refresh_k:10m  rate=6r/m;
# Skill uploads — each up to 512 KB, disk-fill risk.
limit_req_zone $limit_write_subject zone=skill_up_w:10m     rate=10r/m;
# MCP JSON-RPC — allows polling bursts but caps sustained abuse.
limit_req_zone $limit_subject zone=mcp_k:10m          rate=60r/m;
# A2A JSON-RPC (app/a2a.py) — same budget as MCP, its sibling transport.
limit_req_zone $limit_subject zone=a2a_k:10m          rate=60r/m;
# Per-address ceiling over the keyed zones above. A key is free and instant to
# mint, so "per key" on its own would let one address farm keys for budget;
# 300r/m is about five busy agents and the per-key zones do the shaping, this
# only caps the total. Anonymous traffic never reaches it — it is billed per
# address by the zones themselves.
limit_req_zone $limit_key zone=api_ip:10m      rate=300r/m;
# Admission control (load tests 05.10.2026). Per client IP first: one heavy
# client must not crowd out the rest — a single all-clients bucket did exactly
# that (run 3: the load generator pushed two unrelated users into 503). The
# total is only a safety net so a stalled app cannot soak up nginx's
# worker_connections, which every site on this host shares. Both count a
# request until its response is fully sent, so slow far-away clients hold a
# slot longer than the app takes. uvicorn's own --limit-concurrency
# (48 per worker x 2, app/workers.py) guards the app side. 503 past either.
limit_conn_zone $limit_key zone=commroom_ip:10m;
limit_conn_zone $server_name zone=commroom_conn:1m;

server {
    server_name roomcomm.ru www.roomcomm.ru roomcomm.xyz www.roomcomm.xyz;
    client_max_body_size 1m;
    server_tokens off;

    # Security headers (always = applied even on error/proxy responses).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # nginx answers its own limits in the shape the caller speaks. An agent
    # over the limit used to get nginx's built-in HTML error page and could
    # not parse it (report 02.11.2026). Upstream answers are untouched:
    # proxy_intercept_errors stays off, so the daily-quota 429s from
    # app/quota.py pass through with their own JSON body.
    error_page 429 = @rate_limited;
    error_page 503 = @at_capacity;
    # Default, stated because the two below answer with the status they
    # intercept: with recursion on they would intercept themselves.
    recursive_error_pages off;

    # add_header does not inherit into a location that sets its own, so the
    # security headers are repeated here.
    location @rate_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Retry-After $limit_retry always;
        return 429 '{"detail":"rate_limited: too many requests from this caller — retry in ${limit_retry}s. Keys raise the budget and are billed per key: https://roomcomm.xyz/docs","retry_after":${limit_retry}}';
    }

    location @at_capacity {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Retry-After 2 always;
        return 503 '{"detail":"at_capacity: too many connections in flight from this address — retry in a couple of seconds.","retry_after":2}';
    }

    location /admin {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        alias /var/www/roomcomm/llms.txt;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=300";
    }
    location = /agents.md {
        alias /var/www/roomcomm/agents.md;
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=300";
    }
    location = /commroom-skill.tar.gz  { return 301 /roomcomm-skill.tar.gz; }
    location = /skill/scripts/commroom.py { return 301 /skill/scripts/roomcomm.py; }
    location = /roomcomm-skill.tar.gz {
        alias /var/www/roomcomm/roomcomm-skill.tar.gz;
        default_type application/gzip;
        add_header Cache-Control "public, max-age=300";
    }
    location /skills-cdn/ {
        alias /var/lib/commroom/data/skills/;
        default_type application/gzip;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400, immutable";
    }
    location /skill/ {
        alias /var/www/roomcomm/skill/;
        autoindex on;
        types { text/markdown md; text/x-python py; }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }

    # MCP — SSE, no buffering
    location ~ ^/mcp(/.*)?$ {
        limit_req zone=mcp_k burst=30 nodelay;
        limit_req zone=api_ip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # A2A JSON-RPC — /a2a and /a2a/{uuid}. Agent cards (/.well-known/…) stay
    # under location /. Plain JSON request/response, no streaming (yet).
    location ~ ^/a2a(/.*)?$ {
        limit_conn commroom_ip 64;
        limit_conn commroom_conn 512;
        limit_conn_status 503;
        limit_req zone=a2a_k burst=30 nodelay;
        limit_req zone=api_ip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Rate-limit LLM arbiter refresh: expensive, 6/min per key (per IP anonymous)
    location ~ ^/api/rooms/[^/]+/context/refresh$ {
        limit_conn commroom_ip 64;
        limit_conn commroom_conn 512;
        limit_conn_status 503;
        limit_req zone=llm_refresh_k burst=2 nodelay;
        limit_req zone=api_ip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Rate-limit skill uploads: 10/min per key (per IP anonymous), disk-fill
    # protection. POST only.
    location = /api/skills {
        limit_conn commroom_ip 64;
        limit_conn commroom_conn 512;
        limit_conn_status 503;
        limit_req zone=skill_up_w burst=3 nodelay;
        limit_req zone=api_ip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate-limit room creation: 5/min per key (per IP anonymous). POST only —
    # listing rooms (GET) is not creating one.
    location = /api/rooms {
        limit_conn commroom_ip 64;
        limit_conn commroom_conn 512;
        limit_conn_status 503;
        limit_req zone=room_create_w burst=3 nodelay;
        limit_req zone=api_ip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate-limit message sending: 10/min per key (per IP anonymous). POST only —
    # reading a room (GET) does not spend the budget for posting to it.
    location ~ ^/api/rooms/[^/]+/messages$ {
        limit_conn commroom_ip 64;
        limit_conn commroom_conn 512;
        limit_conn_status 503;
        limit_req zone=msg_send_w burst=5 nodelay;
        limit_req zone=api_ip burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_conn commroom_ip 64;
        limit_conn commroom_conn 512;
        limit_conn_status 503;
        limit_req zone=general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/roomcomm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomcomm.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.roomcomm.ru)  { return 301 https://$host$request_uri; }
    if ($host = roomcomm.ru)      { return 301 https://$host$request_uri; }
    if ($host = www.roomcomm.xyz) { return 301 https://$host$request_uri; }
    if ($host = roomcomm.xyz)     { return 301 https://$host$request_uri; }
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name roomcomm.ru www.roomcomm.ru roomcomm.xyz www.roomcomm.xyz;
    return 404;
}
